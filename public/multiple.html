<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Multiple Algorithm Canvas</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="stylesheet" type="text/css" href="style.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222;
        }
        .wrapper {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0px 10px;
            margin: 20px auto;
            width: max-content;
        }
        .app {
            width: 400px;
            height: 300px;
        }
        .app-container {
            text-align: center;
            color: #ccc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .app-container h2 {
            margin: 0;
        }
        .button-container {
            text-align: center;
            margin-top: 20px;
        }
        </style>
    </head>
    <body>
        <div class="wrapper"></div>

        <div class="button-container">
            <button id="start-button">Start</button>
            <button id="reset-button">Reset</button>
            <button id="randomize-button">Randomize</button>
        </div>

        <div class="link-tree">
            <ul>
                <li>
                    <a href="/">index.html</a>
                </li>
                <li>
                    <a href="/multiple.html">multiple.html</a>
                </li>
            </ul>
        </div>

        <script type="module">
            import {run, generateRandomNumberArray} from '../src'
            
            // generate the app containers for each algorithm
            const randomArray = generateRandomNumberArray(35, 100);
            const algorithms = ['bubblesort', 'selectionsort', 'shellsort', 'quicksort'];
            const appInstances = [];
            algorithms.forEach(algorithm => {
                const container = document.createElement('div');
                container.className = 'app-container';
                const heading = document.createElement('h2');
                heading.textContent = algorithm;
                const appDiv = document.createElement('div');
                appDiv.id = algorithm;
                appDiv.className = 'app';
                container.appendChild(heading);
                container.appendChild(appDiv);
                document.querySelector('.wrapper').appendChild(container);
                appInstances.push(run({containerId: algorithm, selectedAlgorithm: algorithm, visibleButtons: [], animationFrameDelay: 2000, dataSet: randomArray, autoResize: false}));
            });

            document.getElementById('start-button').addEventListener('click', () => {
                appInstances.forEach(algorithm => {
                    algorithm.toggleAnimation()
                });
            });
            document.getElementById('reset-button').addEventListener('click', () => {
                appInstances.forEach(algorithm => {
                    algorithm.reset()
                });
            });
            document.getElementById('randomize-button').addEventListener('click', () => {
                const randomArray = generateRandomNumberArray(35, 100);
                appInstances.forEach(algorithm => {
                    algorithm.setDataSet(randomArray);
                });
            });
        </script>

</body>
</html>
